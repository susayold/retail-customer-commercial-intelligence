name: Retail analytics CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  tests-and-sample-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q src tests
      - name: Unit, SQL and synthetic pipeline checks
        run: python -m pytest -q
      - name: Release-readiness contract smoke check
        run: python -m pytest -q tests/test_release_readiness.py tests/test_data_readiness.py tests/test_powerbi_contract.py
