<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <style>text{font-family:Arial,sans-serif;fill:#18324b}.fact{fill:#ffe9c7;stroke:#b87412;stroke-width:2;rx:14}.dim{fill:#e9f5e9;stroke:#3f7f46;stroke-width:2;rx:14}.bridge{fill:#f2eafa;stroke:#7b4aa3;stroke-width:2;rx:14}.title{font-size:28px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:15px}.line{stroke:#71879a;stroke-width:2}</style>
  <text x="600" y="40" text-anchor="middle" class="title">Grain-safe retail star schema</text>
  <rect x="430" y="285" width="340" height="150" class="fact"/><text x="600" y="325" text-anchor="middle" class="label">FCT_TRANSACTION_LINE</text><text x="600" y="355" text-anchor="middle" class="small">one household x basket x product</text><text x="600" y="382" text-anchor="middle" class="small">sales, quantity, discounts, day, week</text><text x="600" y="409" text-anchor="middle" class="small">base for product/category metrics</text>
  <rect x="50" y="90" width="220" height="95" class="dim"/><text x="160" y="128" text-anchor="middle" class="label">DIM_HOUSEHOLD</text><text x="160" y="155" text-anchor="middle" class="small">one observed household</text>
  <rect x="325" y="90" width="220" height="95" class="dim"/><text x="435" y="128" text-anchor="middle" class="label">DIM_PRODUCT</text><text x="435" y="155" text-anchor="middle" class="small">one product</text>
  <rect x="600" y="90" width="220" height="95" class="dim"/><text x="710" y="128" text-anchor="middle" class="label">DIM_DAY / WEEK</text><text x="710" y="155" text-anchor="middle" class="small">observation index</text>
  <rect x="875" y="90" width="220" height="95" class="dim"/><text x="985" y="128" text-anchor="middle" class="label">DIM_STORE</text><text x="985" y="155" text-anchor="middle" class="small">one observed store</text>
  <path d="M160 185 V245 H480 V280" class="line"/><path d="M435 185 V280" class="line"/><path d="M710 185 V280" class="line"/><path d="M985 185 V245 H720 V280" class="line"/>
  <rect x="40" y="545" width="250" height="95" class="fact"/><text x="165" y="583" text-anchor="middle" class="label">FCT_BASKET</text><text x="165" y="610" text-anchor="middle" class="small">one basket</text>
  <rect x="340" y="545" width="250" height="95" class="fact"/><text x="465" y="583" text-anchor="middle" class="label">FCT_PROMOTION</text><text x="465" y="610" text-anchor="middle" class="small">product x store x week</text>
  <rect x="640" y="545" width="250" height="95" class="fact"/><text x="765" y="583" text-anchor="middle" class="label">FCT_CAMPAIGN</text><text x="765" y="610" text-anchor="middle" class="small">household x campaign</text>
  <rect x="940" y="545" width="220" height="95" class="bridge"/><text x="1050" y="583" text-anchor="middle" class="label">COUPON BRIDGE</text><text x="1050" y="610" text-anchor="middle" class="small">coupon x product x campaign</text>
  <path d="M500 435 V500 H165 V540" class="line"/><path d="M600 435 V500 H465 V540" class="line"/><path d="M700 435 V500 H765 V540" class="line"/><path d="M760 435 V500 H1050 V540" class="line"/>
</svg>