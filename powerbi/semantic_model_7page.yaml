pages:
  - name: Executive Customer & Commercial Health
    source_tables: [Mart_Panel_Weekly, Mart_Basket, Mart_Decision_Alerts, PBIX_Mart_Store_Weekly, PBIX_Mart_Brand_Category]
  - name: Customer Engagement & Segmentation
    source_tables: [Mart_Household_Summary, Mart_Customer_Segment, Mart_Basket, PBIX_Dim_Segment]
  - name: Basket & Category Intelligence
    source_tables: [Mart_Basket, PBIX_Mart_Category_Household_Weekly, PBIX_Mart_Category_Weekly, PBIX_Analysis_Category_Penetration, Mart_Cross_Category_Pair, PBIX_Dim_Category]
  - name: Category, Brand & Private Label
    source_tables: [PBIX_Mart_Category_Weekly, PBIX_Mart_Brand_Category, PBIX_Analysis_Category_Penetration, PBIX_Analysis_Category_Decomposition_13W, PBIX_Private_Label_Category_Audit, PBIX_Dim_Category]
  - name: Promotion & Merchandising
    source_tables: [Mart_Promotion_Category_Week, Analysis_Promotion_Association, Analysis_Promotion_Dependency, PBIX_Promotion_Model_Audit]
  - name: Campaign & Coupon Intelligence
    source_tables: [Mart_Campaign_Household, Mart_Campaign_Summary, Analysis_Campaign_Funnel, Analysis_Campaign_Segment, Mart_Coupon_Summary, Analysis_Coupon_Campaign, Analysis_Coupon_Segment, Analysis_Coupon_Category, Analysis_Coupon_Basket, Analysis_Coupon_Repeat_Category, PBIX_Campaign_KPI_Scope]
  - name: Root Cause & Decision Center
    source_tables: [PBIX_Root_Cause_Panel_Spend_Drivers, PBIX_Root_Cause_Panel_Spend_Periods, PBIX_Analysis_Root_Cause_Cases, PBIX_Analysis_Executive_Decisions, Mart_Decision_Alerts, PowerBI_Metric_Reconciliation]
