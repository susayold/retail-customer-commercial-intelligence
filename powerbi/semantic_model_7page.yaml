  - from: PBIX_Dim_Category[category_key]
    to: PBIX_Analysis_Category_Penetration[category_key]
    cardinality: one_to_many
    cross_filter: single
  - from: PBIX_Dim_Category[category_key]
    to: PBIX_Analysis_Category_Decomposition_13W[category_key]
