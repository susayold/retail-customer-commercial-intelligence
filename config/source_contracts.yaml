# Raw source contracts. These are schema expectations, not redistributed source data.
# Contract failures should stop the pipeline before warehouse builds.
sources:
  transaction_data:
    file: transaction_data.csv
    grain: transaction line
    required_columns:
      - household_key
      - BASKET_ID
      - DAY
      - PRODUCT_ID
      - QUANTITY
      - SALES_VALUE
      - STORE_ID
      - RETAIL_DISC
      - COUPON_DISC
      - COUPON_MATCH_DISC
      - TRANS_TIME
      - WEEK_NO
  causal_data:
    file: causal_data.csv
    grain: product x store x week promotion state
    required_columns:
      - PRODUCT_ID
      - STORE_ID
      - WEEK_NO
      - display
      - mailer
  coupon:
    file: coupon.csv
    grain: coupon x product x campaign
    required_columns:
      - COUPON_UPC
      - PRODUCT_ID
      - CAMPAIGN
  coupon_redempt:
    file: coupon_redempt.csv
    grain: coupon redemption event
    required_columns:
      - household_key
      - DAY
      - COUPON_UPC
      - CAMPAIGN
  campaign_table:
    file: campaign_table.csv
    grain: household x campaign exposure
    required_columns:
      - household_key
      - CAMPAIGN
      - DESCRIPTION
  campaign_desc:
    file: campaign_desc.csv
    grain: campaign
    required_columns:
      - DESCRIPTION
      - CAMPAIGN
      - START_DAY
      - END_DAY
  product:
    file: product.csv
    grain: product
    required_columns:
      - PRODUCT_ID
      - MANUFACTURER
      - DEPARTMENT
      - BRAND
      - COMMODITY_DESC
      - SUB_COMMODITY_DESC
      - CURR_SIZE_OF_PRODUCT
  hh_demographic:
    file: hh_demographic.csv
    grain: household demographic snapshot
    required_columns:
      - classification_1
      - classification_2
      - classification_3
      - HOMEOWNER_DESC
      - classification_5
      - classification_4
      - KID_CATEGORY_DESC
      - household_key
