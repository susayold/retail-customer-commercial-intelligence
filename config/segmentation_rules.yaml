segment_version: v1_deterministic
rules:
  - priority: 1
    name: High-Value Declining
    condition: monetary_quintile >= 4 and trajectory = Declining
  - priority: 2
    name: High-Value Engaged
    condition: monetary_quintile >= 4 and trajectory in [Growing, Stable]
  - priority: 3
    name: Frequent Core
    condition: frequency_quintile >= 4 and monetary_quintile < 4
  - priority: 4
    name: Promotion-Responsive
    condition: coupon_basket_rate >= 0.30 or discount_share >= 0.20
  - priority: 5
    name: Private-Label Loyal
    condition: private_label_share >= 0.60
  - priority: 6
    name: Occasional
    condition: frequency_quintile <= 2 and active_weeks <= 8
  - priority: 7
    name: Low-Engagement
    condition: all other observed households
assignment_policy:
  exactly_one_segment: true
  precedence: listed order
  insufficient_history_label: Insufficient History
